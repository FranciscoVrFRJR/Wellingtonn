<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Feliz Aniversário, Wellington! - Street Fighter II Turbo (Arcade)</title>
    <!-- Fonte estilo fliperama clássico -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050508;
            overflow: hidden;
            font-family: 'Press Start 2P', monospace;
            color: #fff;
        }

        /* Tela de Boas-Vindas temática com fadeout bem suave (2.5s) */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0b0b1a 0%, #1a0808 50%, #050508 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 9999;
            padding: 20px;
            transition: opacity 2.5s ease-out, visibility 2.5s ease-out;
            border: 8px solid #111;
        }

        #welcome-screen.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .company-tag {
            font-size: clamp(0.5rem, 1.5vw, 0.8rem);
            color: #3498db;
            letter-spacing: 3px;
            margin-bottom: 15px;
            text-shadow: 2px 2px #000;
        }

        .arcade-title {
            font-size: clamp(1.2rem, 3.5vw, 2.2rem);
            color: #f1c40f;
            text-shadow: 4px 4px 0px #c0392b, 0 0 25px rgba(241, 196, 15, 0.4);
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .birthday-banner {
            background-color: #c0392b;
            border: 3px solid #f1c40f;
            padding: 12px 20px;
            font-size: clamp(0.65rem, 1.8vw, 0.95rem);
            color: #fff;
            margin-bottom: 35px;
            box-shadow: 0 4px 0 #78281f;
            transform: rotate(-1deg);
        }

        .start-btn {
            background-color: #f1c40f;
            color: #2c3e50;
            border: 4px solid #fff;
            padding: 16px 28px;
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(0.75rem, 2vw, 1.1rem);
            cursor: pointer;
            box-shadow: 0 6px 0 #7f6000, 0 0 20px rgba(241, 196, 15, 0.6);
            transition: transform 0.1s, box-shadow 0.1s, background-color 0.2s;
            animation: blinkCoin 1.2s infinite;
        }

        .start-btn:hover {
            background-color: #f39c12;
        }

        .start-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #7f6000;
        }

        .hint-text {
            font-size: clamp(0.45rem, 1.2vw, 0.65rem);
            color: #888;
            margin-top: 25px;
        }

        /* Container do Emulador Arcade */
        #game-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            width: 100%;
            height: 100%;
            max-width: 900px;
            max-height: 675px;
        }

        @keyframes blinkCoin {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
    </style>
</head>
<body>

    <!-- Elementos de áudio -->
    <audio id="start-sound" src="63.mp3" preload="auto"></audio>
    <audio id="intro-music-1" src="incapcom.mp3" preload="auto"></audio>

    <!-- Frame 1: Tela de Apresentação Temática -->
    <div id="welcome-screen">
        <div class="company-tag">SUPER STREET FIGHTER II TURBO - ARCADE EDITION</div>
        <div class="arcade-title">PRESENTE ESPECIAL DO SEU<br><span style="color: #e74c3c; text-shadow: 4px 4px 0px #f1c40f;">IRMÃO CAGÃO</span></div>
        
        <div class="birthday-banner">
            ⭐ FELIZ ANIVERSÁRIO, TONTON! ⭐
        </div>

        <button class="start-btn" id="play-btn" onclick="iniciarPresente()">PRESSIONE ENTER OU CLIQUE AQUI</button>
        <div class="hint-text">Toque na tela ou aperte Enter/Espaço para jogar</div>
    </div>

    <!-- Frame 2: Emulador Arcade -->
    <div id="game-wrapper">
        <div id="game-container"></div>
    </div>

    <script>
        let jogoIniciado = false;
        let timersMusica = [];

        function forcarFocoNoJogo() {
            const canvas = document.querySelector('#game-container canvas');
            if (canvas) {
                canvas.setAttribute('tabindex', '0');
                canvas.focus();
            }
            window.focus();
        }

        function pararTodasAsMusicas() {
            const m1 = document.getElementById('intro-music-1');
            
            if (m1) { m1.pause(); m1.currentTime = 0; }

            timersMusica.forEach(timer => clearTimeout(timer));
            timersMusica = [];
        }

        function iniciarPresente() {
            if (jogoIniciado) return;
            jogoIniciado = true;

            // 1. Toca o som de início/ficha imediatamente no clique
            const somInicio = document.getElementById('start-sound');
            if (somInicio) {
                somInicio.currentTime = 0;
                somInicio.play().catch(err => console.log("Áudio bloqueado:", err));
            }

            // 2. Toca a Música 1 (incapcom.mp3) após exatamente 13 segundos e deixa rolar direto
            let t1 = setTimeout(() => {
                const musica1 = document.getElementById('intro-music-1');
                if (musica1) {
                    musica1.currentTime = 0;
                    musica1.play().catch(err => console.log("Música 1 bloqueada:", err));
                }
            }, 19000); // 19 segundos

            timersMusica.push(t1);

            if (document.activeElement) {
                document.activeElement.blur();
            }

            const btn = document.getElementById('play-btn');
            btn.style.animation = 'none';
            btn.innerText = "CARREGANDO LUTA...";

            const screen = document.getElementById('welcome-screen');
            screen.classList.add('fade-out');
            setTimeout(() => {
                screen.style.display = 'none';
            }, 3500);

            // Configuração do EmulatorJS
            window.EJS_player = "#game-container";
            window.EJS_core = "fbneo";
            window.EJS_gameUrl = "ssf2t.zip";
            window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
            window.EJS_startOnLoaded = true;
            window.EJS_VirtualGamepadSettings = []; 

            window.EJS_onLoad = function() {
                try {
                    const customKeys = {
                        "P1_UP": "KeyW",
                        "P1_DOWN": "KeyS",
                        "P1_LEFT": "KeyA",
                        "P1_RIGHT": "KeyD",
                        "P1_BUTTON_1": "KeyU",
                        "P1_BUTTON_2": "KeyJ",
                        "P1_BUTTON_3": "KeyI",
                        "P1_BUTTON_4": "KeyK",
                        "P1_BUTTON_5": "KeyO",
                        "P1_BUTTON_6": "KeyL",
                        "P1_START": "Enter",
                        "P1_COIN": "ShiftRight"
                    };

                    if (window.EJS_emulator && window.EJS_emulator.innerSettings) {
                        window.EJS_emulator.innerSettings.set("keys-p1", customKeys);
                    }
                } catch(e) {
                    console.log("Mapeamento automático aplicado.", e);
                }
            };

            window.EJS_onGameStart = function() {
                forcarFocoNoJogo();
                setTimeout(forcarFocoNoJogo, 500);
            };

            const script = document.createElement('script');
            script.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
            document.body.appendChild(script);
        }

        document.addEventListener('click', function() {
            if (jogoIniciado) {
                forcarFocoNoJogo();
            }
        });

        // Gerenciamento de teclado (Aperte V para cortar o som se precisar)
        window.addEventListener('keydown', function(event) {
            const tecla = event.key.toLowerCase();

            if (tecla === 'v') {
                pararTodasAsMusicas();
            }

            if (!jogoIniciado && (event.key === 'Enter' || event.key === ' ')) {
                event.preventDefault();
                iniciarPresente();
            }
        });
    </script>

</body>
</html>
